name: Build Installer Desktop Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag versi rilis (contoh: v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Compile & Package Windows Installer (.exe / .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Next.js & Tauri Desktop Windows Installer
        run: pnpm tauri build

      - name: Upload Windows Installer (.exe NSIS Setup)
        uses: actions/upload-artifact@v4
        with:
          name: SiMarta-Windows-Setup-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/simarta.exe
          if-no-files-found: error

      - name: Publish to GitHub Release (jika ada tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/simarta.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
